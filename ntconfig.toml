clbm = "@lm && txtc && @mtd"
clbs = "@ls && txtc && @mtd"
bd2 = "dal && flutter run -d R5CXC2GES8Y --release"
clbw = "@lw && txtc && @mtd"
pjcg = "ignored && tp ls && ral ls"
dal = "dart analyze lib/"
acbe = "@ntc && cargo clean && cargo build --release && exit"
fr = "flutter run -d RFCW71EGWDW --release"
clbp = "@lp && txtc && @mtd"
csh = "@nts && txtc && back"
cdeb = "cargo deb"
frp = "flutter clean && flutter pub get"
rm = "del"
ip = "ipconfig"
ct = "cargo test"
clbr = "@lr && txtc && @mtd"
clbdb = "@ldb && txtc && @mtd"
