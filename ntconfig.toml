ignored_directory_names = [
    ".dart_tool",
    ".git",
    ".idea",
    "build",
    "installer",
    "linux",
    "macos",
    "node_modules",
    "target",
    "test",
    "venv",
    "web",
    "windows",
    "ios",
    "android",
]
ignored_extensions = [
    "lock",
    "log",
]
extra_supported_extensions = []
